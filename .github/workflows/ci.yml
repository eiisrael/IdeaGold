name: IdeaGold CI
on:
  push:
    branches:
      - agent/ideagold-v5-mining-intelligence
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:smoke
